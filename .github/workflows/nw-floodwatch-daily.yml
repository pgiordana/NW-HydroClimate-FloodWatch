name: NW FloodWatch daily production

on:
  schedule:
    - cron: "17 10 * * *"
      timezone: "Europe/Rome"
    - cron: "0 11 * * *"
      timezone: "Europe/Rome"
    - cron: "30 12 * * *"
      timezone: "Europe/Rome"
    - cron: "0 14 * * *"
      timezone: "Europe/Rome"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/nwfloodwatch-run-trigger"

permissions:
  contents: read

concurrency:
  group: nw-floodwatch-daily-production
  cancel-in-progress: true

jobs:
  daily-production:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      NWF_CMEMS_MAX_ATTEMPTS: "4"
      NWF_CMEMS_ATTEMPT_TIMEOUT_SECONDS: "300"
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}

    steps:
      - name: Checkout isolated web runtime branch
        uses: actions/checkout@v4
        with:
          ref: web-runtime-v1

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Validate web runtime helpers
        run: |
          python -m py_compile \
            web_runtime/run_web_pipeline.py \
            web_runtime/backfill_previous_day.py \
            web_runtime/patch_site_notice.py \
            web_runtime/cmems_resilient_subset.py \
            web_runtime/patch_cmems_resilience.py

      - name: Decide whether today's production run is needed
        id: production_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import hashlib
          import time
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          output = os.environ["GITHUB_OUTPUT"]
          event_name = os.environ.get("EVENT_NAME", "")

          # workflow_dispatch and the explicit trigger-file push are intentional.
          if event_name != "schedule":
              with open(output, "a", encoding="utf-8") as f:
                  f.write("needs_run=true\n")
              print(f"Event {event_name!r}: production run explicitly requested.")
              raise SystemExit(0)

          today = datetime.now(ZoneInfo("Europe/Rome")).date().isoformat()
          url = f"https://nw-floodwatch.pages.dev/data/latest.json?gate={int(time.time())}"

          try:
              req = urllib.request.Request(
                  url,
                  headers={
                      "Cache-Control": "no-cache",
                      "User-Agent": "NW-FloodWatch-Schedule-Gate",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  remote = json.loads(response.read().decode("utf-8"))

              issue_date = remote.get("issue_date")
              in_core = remote.get("in_core_season")
              interpretable = bool(remote.get("scientific_beta_interpretation"))
              print(
                  f"Published issue_date={issue_date!r}; today={today!r}; "
                  f"in_core_season={in_core!r}; interpretable={interpretable!r}"
              )

              # During Sep-Dec, a current-day but blocked payload is NOT current
              # production: every later fallback must retry it.
              current_and_usable = (
                  issue_date == today
                  and (
                      in_core is False
                      or interpretable
                  )
              )

              with open(output, "a", encoding="utf-8") as f:
                  f.write(f"needs_run={'false' if current_and_usable else 'true'}\n")

              if current_and_usable:
                  print("Today's usable site is already published: scheduled fallback will exit cleanly.")
              else:
                  print("Today's usable scientific production is not yet published: full run is required.")

          except Exception as exc:
              # Fail open: inability to check the public site must never suppress production.
              print(f"Freshness gate could not verify the public site ({type(exc).__name__}: {exc}).")
              print("Fail-open policy: full production run will proceed.")
              with open(output, "a", encoding="utf-8") as f:
                  f.write("needs_run=true\n")
          PY

      - name: Production already current
        if: ${{ steps.production_gate.outputs.needs_run == 'false' }}
        run: echo "NW FloodWatch is already published for today; no duplicate production run is needed."

      - name: Verify required deployment secrets
        if: ${{ steps.production_gate.outputs.needs_run == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          echo "Cloudflare deployment secrets present."

      - name: Install ECMWF freshness-check dependency
        if: ${{ steps.production_gate.outputs.needs_run == 'true' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install ecmwf-opendata

      - name: Require current-day ECMWF IFS 00Z
        if: ${{ steps.production_gate.outputs.needs_run == 'true' }}
        run: |
          python web_runtime/wait_for_ecmwf_00z.py \
            --interval-minutes 10 \
            --max-wait-minutes 90

      - name: Download and verify immutable NW FloodWatch runtime
        if: ${{ steps.production_gate.outputs.needs_run == 'true' }}
        run: python web_runtime/bootstrap_runtime.py

      - name: Install full runtime dependencies
        if: ${{ steps.production_gate.outputs.needs_run == 'true' }}
        run: |
          python -m pip install -r .web_runtime/runtime/NW_FloodWatch_Definitivo/requirements.txt

      - name: Restore antecedent cache
        id: antecedent_cache_restore
        if: ${{ steps.production_gate.outputs.needs_run == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: .web_state/antecedent_cache
          key: nwfloodwatch-antecedent-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nwfloodwatch-antecedent-${{ runner.os }}-

      - name: Run full NW FloodWatch production chain
        if: ${{ steps.production_gate.outputs.needs_run == 'true' }}
        run: |
          python web_runtime/run_web_pipeline.py \
            --runtime-root .web_runtime/runtime/NW_FloodWatch_Definitivo \
            --site-dir web_runtime/site \
            --persistent-cache-dir .web_state/antecedent_cache \
            --mode full

      - name: Save antecedent cache immediately after scientific chain
        if: ${{ steps.production_gate.outputs.needs_run == 'true' && success() }}
        uses: actions/cache/save@v4
        with:
          path: .web_state/antecedent_cache
          key: nwfloodwatch-antecedent-${{ runner.os }}-${{ github.run_id }}

      - name: Validate public-site payload
        if: ${{ steps.production_gate.outputs.needs_run == 'true' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("web_runtime/site/data/latest.json")
          d = json.loads(p.read_text(encoding="utf-8"))

          assert d["schema"] == "nwfloodwatch.web.latest.v1"
          assert d["experimental"] is True
          assert d["official_warning_use_allowed"] is False
          assert len(d.get("receptors", [])) == 20

          # Each JSON must point to the actual, uniquely versioned PDF for this run.
          pdf_relative = d.get("bulletin_pdf", "")
          assert pdf_relative == f"downloads/NW_FloodWatch_Bollettino_{d['run_id']}.pdf", pdf_relative
          pdf = Path("web_runtime/site") / pdf_relative
          assert pdf.is_file() and pdf.stat().st_size > 1024, f"Missing PDF: {pdf}"
          assert pdf.open("rb").read(5) == b"%PDF-", f"Invalid PDF: {pdf}"
          assert d["issue_date"] == f"{d['run_id'][:4]}-{d['run_id'][4:6]}-{d['run_id'][6:8]}"

          print("DAILY STATIC WEB PAYLOAD PASS")
          print("run_id=", d.get("run_id"))
          print("issue_date=", d.get("issue_date"))
          print("in_core_season=", d.get("in_core_season"))
          print("scientific_beta_interpretation=", d.get("scientific_beta_interpretation"))
          if d.get("in_core_season") and not d.get("scientific_beta_interpretation"):
              print("WARNING: current CORE-season payload is blocked; scheduled fallback will retry it.")
          PY

      - name: Deploy current site to Cloudflare Pages
        if: ${{ steps.production_gate.outputs.needs_run == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web_runtime/site --project-name=nw-floodwatch --branch=main

      - name: Verify public deployment matches this run
        if: ${{ steps.production_gate.outputs.needs_run == 'true' }}
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          from pathlib import Path

          import hashlib
          local = json.loads(Path("web_runtime/site/data/latest.json").read_text(encoding="utf-8"))
          expected = local.get("run_id")
          local_pdf_path = Path("web_runtime/site") / local["bulletin_pdf"]
          expected_pdf_sha256 = hashlib.sha256(local_pdf_path.read_bytes()).hexdigest()
          url = "https://nw-floodwatch.pages.dev/data/latest.json"

          last_error = None
          attempts = 30
          for attempt in range(1, attempts + 1):
              try:
                  req = urllib.request.Request(
                      url + f"?verify={int(time.time())}",
                      headers={"Cache-Control": "no-cache", "User-Agent": "NW-FloodWatch-CI"},
                  )
                  with urllib.request.urlopen(req, timeout=20) as response:
                      remote = json.loads(response.read().decode("utf-8"))
                  got = remote.get("run_id")
                  print(
                      f"Verification attempt {attempt}/{attempts} | "
                      f"expected={expected} | remote={got}",
                      flush=True,
                  )
                  if got == expected:
                      assert remote.get("official_warning_use_allowed") is False
                      assert remote.get("experimental") is True
                      assert remote.get("bulletin_pdf") == local["bulletin_pdf"], "PDF link mismatch"
                      pdf_url = "https://nw-floodwatch.pages.dev/" + remote["bulletin_pdf"]
                      pdf_req = urllib.request.Request(
                          pdf_url + f"?verify={int(time.time())}",
                          headers={"Cache-Control": "no-cache", "User-Agent": "NW-FloodWatch-CI"},
                      )
                      with urllib.request.urlopen(pdf_req, timeout=30) as pdf_resp:
                          online_pdf = pdf_resp.read()
                      assert online_pdf.startswith(b"%PDF-"), "Published PDF is invalid"
                      if hashlib.sha256(online_pdf).hexdigest() != expected_pdf_sha256:
                          raise RuntimeError("Published PDF SHA256 differs from this run's local PDF")
                      print("CLOUDFLARE PUBLIC DEPLOYMENT PASS | JSON and PDF SHA256 match", flush=True)
                      break
                  last_error = f"run_id mismatch: expected {expected}, got {got}"
              except Exception as exc:
                  last_error = f"{type(exc).__name__}: {exc}"
                  print(
                      f"Verification attempt {attempt}/{attempts} failed: {last_error}",
                      flush=True,
                  )

              if attempt < attempts:
                  time.sleep(10)
          else:
              raise RuntimeError(f"Cloudflare deployment verification failed: {last_error}")
          PY

      - name: Upload daily site package
        if: ${{ always() && steps.production_gate.outputs.needs_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: nw-floodwatch-daily-site-${{ github.run_id }}
          path: web_runtime/site
          if-no-files-found: error
          retention-days: 30
